name: One-off composer destination first

on:
  push:
    branches:
      - feat/ui-redesign-v1
    paths:
      - scripts/patch_composer_destination_first.py
      - .github/workflows/oneoff-composer-destination-first.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_composer_destination_first.py
      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/publication-editor.tsx
          git commit -m "feat: priorizar destinos e simplificar validações"
          git push origin HEAD:feat/ui-redesign-v1
