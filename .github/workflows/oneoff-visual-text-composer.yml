name: One-off visual text composer

on:
  push:
    branches:
      - feat/ui-redesign-v1
    paths:
      - scripts/patch_visual_text_composer.py
      - .github/workflows/oneoff-visual-text-composer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visual text composer patch
        run: python scripts/patch_visual_text_composer.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/publication-editor.tsx
          git commit -m "feat: editor visual mobile para mídia e vídeo"
          git push origin HEAD:feat/ui-redesign-v1
