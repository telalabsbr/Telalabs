name: One-off fix composer patch

on:
  push:
    branches:
      - feat/ui-redesign-v1
    paths:
      - scripts/fix_composer_patch_script.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_composer_patch_script.py
      - name: Commit patch-script fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_composer_ux.py
          git commit -m "chore: corrigir patch do composer"
          git push origin HEAD:feat/ui-redesign-v1
