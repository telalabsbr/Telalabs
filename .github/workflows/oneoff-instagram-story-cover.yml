name: One-off Instagram story cover

on:
  push:
    branches:
      - feat/ui-redesign-v1
    paths:
      - scripts/patch_instagram_story_cover.py
      - scripts/instagram-story-cover-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Instagram story cover patch
        run: python scripts/patch_instagram_story_cover.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/social/instagram-adapter.ts
          git commit -m "feat: stories capas e permalink no Instagram"
          git push origin HEAD:feat/ui-redesign-v1
